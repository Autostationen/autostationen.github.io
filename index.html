<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground:   #0f1c26;
    --ground-2: #132330;
    --panel:    #263f50;
    --panel-2:  #1b2f3d;
    --knap:     #284254;
    --kant:     #3d5c70;
    --kant-2:   #4a6b80;
    --tekst:    #eaf2f7;
    --dim:      #a8c0cf;
    --dim-2:    #7e9bb0;
    --groen:    #a5cda2;
    --groen-m:  #7fae7c;
    --rav:      #d7a64e;
    --roed:     #c9736f;
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --disp: "Familjen Grotesk", "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--ground);
    color: var(--tekst);
    font: 400 16px/1.62 var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 20px;
  }
  /* Det svage lysskaer bagved */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(760px 420px at 22% 30%, rgba(165,205,162,.10), transparent 68%),
      radial-gradient(620px 380px at 82% 74%, rgba(61,92,112,.30), transparent 70%);
  }

  .ark {
    position: relative; z-index: 1;
    width: 100%; max-width: 1060px;
    display: grid; grid-template-columns: 1fr 420px; gap: 56px; align-items: center;
  }

  /* ── Venstre side ── */
  .logo {
    width: 62px; height: 62px; border-radius: 15px; display: block;
    border: 1px solid var(--kant-2); box-shadow: 0 14px 32px rgba(0,0,0,.45);
  }
  .eyebrow {
    margin: 26px 0 10px;
    font: 500 11.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
    color: var(--groen);
  }
  h1 {
    margin: 0 0 16px;
    font: 600 46px/1.08 var(--disp); letter-spacing: -.02em; color: var(--tekst);
  }
  .lead { margin: 0; max-width: 46ch; font-size: 16.5px; line-height: 1.6; color: var(--dim); }
  .lead b { color: var(--tekst); font-weight: 600; }

  /* ── Kortet ── */
  .kort {
    background: var(--panel-2);
    border: 1px solid var(--kant);
    border-radius: 14px;
    padding: 30px 28px 26px;
    box-shadow: 0 26px 60px rgba(0,0,0,.46);
  }
  .kort h2 { margin: 0 0 6px; font: 600 24px/1.2 var(--disp); color: var(--tekst); }
  .kort .under { margin: 0 0 22px; font-size: 13.5px; line-height: 1.55; color: var(--dim-2); }

  label {
    display: block; margin-bottom: 8px;
    font: 600 11px/1 var(--sans); letter-spacing: .07em; text-transform: uppercase;
    color: var(--dim-2);
  }
  input[type="password"], input[type="text"] {
    width: 100%; padding: 13px 14px;
    background: var(--ground); color: var(--tekst);
    border: 1px solid var(--kant); border-radius: 8px;
    font: 400 16px/1.2 var(--mono); letter-spacing: .06em;
    outline: none; transition: border-color .14s ease, box-shadow .14s ease;
  }
  input:focus { border-color: var(--groen-m); box-shadow: 0 0 0 3px rgba(165,205,162,.14); }
  input::placeholder { color: #56748a; letter-spacing: .18em; }

  .vis {
    display: flex; align-items: center; gap: 8px; margin-top: 11px;
    font-size: 12.5px; color: var(--dim-2); cursor: pointer; user-select: none;
  }
  .vis input { width: 14px; height: 14px; accent-color: var(--groen-m); cursor: pointer; }

  button {
    width: 100%; margin-top: 18px; padding: 13px 16px;
    background: var(--groen); color: #16242e;
    border: none; border-radius: 8px; cursor: pointer;
    font: 600 15px/1 var(--sans);
    transition: filter .14s ease, transform .06s ease;
  }
  button:hover:not(:disabled) { filter: brightness(1.07); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .6; cursor: progress; }

  .fejl {
    margin-top: 14px; padding: 10px 12px; border-radius: 7px;
    background: rgba(201,115,111,.13); border: 1px solid rgba(201,115,111,.42);
    font-size: 13px; color: #e6b0ad;
  }
  .fejl[hidden] { display: none; }

  .fod {
    margin-top: 22px; padding-top: 17px; border-top: 1px solid var(--kant);
    font-size: 12px; line-height: 1.6; color: var(--dim-2); text-align: center;
  }

  @media (max-width: 900px) {
    .ark { grid-template-columns: 1fr; gap: 38px; max-width: 460px; }
    h1 { font-size: 36px; }
    .logo { width: 54px; height: 54px; }
  }
</style>
</head>

<script>
(function () {
  var form  = document.getElementById('form');
  var felt  = document.getElementById('kode');
  var knap  = document.getElementById('knap');
  var fejl  = document.getElementById('fejl');
  var last  = JSON.parse(document.getElementById('last').textContent);
  var forkerte = 0;

  document.getElementById('visKode').addEventListener('change', function () {
    felt.type = this.checked ? 'text' : 'password';
    felt.focus();
  });

  function b64tilBytes(s) {
    var raa = atob(s), ud = new Uint8Array(raa.length);
    for (var i = 0; i < raa.length; i++) ud[i] = raa.charCodeAt(i);
    return ud;
  }

  function visFejl(besked) {
    fejl.textContent = besked;
    fejl.hidden = false;
    knap.disabled = false;
    knap.textContent = 'Videre';
    felt.select();
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var kode = felt.value;
    if (!kode) return;

    fejl.hidden = true;
    knap.disabled = true;
    knap.textContent = 'Låser op…';

    // Giv browseren et oejeblik til at tegne knappen om foer PBKDF2 spaerrer traaden
    await new Promise(function (r) { setTimeout(r, 30); });

    try {
      var raaNoegle = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(kode), 'PBKDF2', false, ['deriveKey']
      );
      var noegle = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64tilBytes(last.salt), iterations: last.iter, hash: 'SHA-256' },
        raaNoegle,
        { name: 'AES-GCM', length: 256 },
        false, ['decrypt']
      );
      var klar = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64tilBytes(last.iv) },
        noegle,
        b64tilBytes(last.data)
      );

      var html = new TextDecoder().decode(klar);
      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      forkerte++;
      if (forkerte >= 3) {
        // Hvert forkert forsoeg herefter koster laengere tid. Det bremser
        // den der sidder og gaetter i browseren — ikke den der skriver sit
        // eget script, men saa er PBKDF2-runderne der stadig.
        var vent = Math.min(30, Math.pow(2, forkerte - 3));
        knap.textContent = 'Vent ' + vent + ' sek…';
        var tilbage = vent;
        var ur = setInterval(function () {
          tilbage--;
          if (tilbage > 0) { knap.textContent = 'Vent ' + tilbage + ' sek…'; }
          else {
            clearInterval(ur);
            visFejl('Forkert kode. Prøv igen.');
          }
        }, 1000);
        fejl.textContent = 'Forkert kode — ' + forkerte + '. forsøg.';
        fejl.hidden = false;
        return;
      }
      visFejl('Forkert kode. Prøv igen.');
    }
  });

  if (!crypto || !crypto.subtle) {
    visFejl('Din browser understøtter ikke den lås siden bruger. Prøv en nyere browser.');
    knap.disabled = true;
  }
})();
</script>
